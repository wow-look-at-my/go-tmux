name: CI

on:
  push:
    branches: ['**']

concurrency:
  group: gha_${{ github.repository }}_${{ github.workflow }}_${{ github.ref != 'refs/heads/master' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  id-token: write
  contents: write
  actions: read
  checks: read
  deployments: write
  artifact-metadata: write

jobs:
  test:
    runs-on: ${{ github.event.repository.visibility == 'public' && 'ubuntu-latest' || vars.CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
      # gmux needs pseudo-terminals, which Windows does not have. The Windows payload stays in the set because the release build cannot read the build info of an executable built without it.
      - uses: wow-look-at-my/go-toolchain@lkgb
        with:
          cosmo-platforms: linux/amd64,linux/arm64,darwin/arm64,windows/amd64

  # The Go tests and dats/cli.dats on a Mac, against the APE built there. The go-toolchain CLI publishes nothing, so the test job stays the one release.
  macos:
    if: github.event.repository.visibility == 'public'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: wow-look-at-my/actions@secret-server#latest
      - if: env.PRIVATE_ORG_REPO_READ != ''
        run: git config --global url."https://x-access-token:${PRIVATE_ORG_REPO_READ}@github.com/wow-look-at-my/".insteadOf "https://github.com/wow-look-at-my/"
      - id: download
        uses: wow-look-at-my/buildhost/.github/actions/buildhost-download@lkgb
        with:
          project: go-toolchain
      - run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/go-toolchain-bin"
          mkdir -p "$bin"
          mv "${{ steps.download.outputs.path }}" "$bin/go-toolchain"
          chmod +x "$bin/go-toolchain"
          echo "$bin" >> "$GITHUB_PATH"
      - run: go-toolchain
        env:
          GITHUB_TOKEN: ${{ github.token }}
